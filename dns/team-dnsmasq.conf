# Mac 1 PRIMARY DNS (Aryan) - private DNS for teamTeamCN.test
# GENERATED by scripts/render-configs.sh from env.sh - edit env.sh, not this file.
# Listen IP: 10.7.20.4 | Subnet: 10.7.0.0/19 | Netmask: 255.255.224.0 (0xffffe000)
port=53
listen-address=127.0.0.1,10.7.20.4
bind-interfaces
# Do not read /etc/resolv.conf or /etc/hosts: only what is written here + explicit upstreams
no-resolv
no-hosts
server=8.8.8.8
server=10.5.7.1
# Names under teamTeamCN.test are answered ONLY by us (never forwarded to the internet)
local=/teamTeamCN.test/
# TTL (seconds) on our own records = how long clients may cache them (Ext B)
local-ttl=30
# host-record = exact name -> IPv4 (AAAA gets a clean 'no data' answer)
# app = the service name (Ext B/E move it); api = control record, always the primary edge
host-record=app.teamTeamCN.test,10.7.26.115
host-record=api.teamTeamCN.test,10.7.26.115
# Log every query (live evidence of WHICH server answered WHOM)
log-queries
log-facility=-
