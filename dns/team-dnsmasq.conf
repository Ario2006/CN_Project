# Mac 1 - private DNS for teamX.test
# GENERATED by scripts/render-configs.sh from env.sh - edit env.sh, not this file.
port=53
listen-address=127.0.0.1,10.7.30.82
bind-interfaces
# Do not read /etc/resolv.conf or /etc/hosts: only what is written here + explicit upstreams
no-resolv
no-hosts
server=10.5.7.1
server=8.8.8.8
# Names under teamX.test are answered ONLY by us (never forwarded to the internet)
local=/teamX.test/
local-ttl=30
host-record=app.teamX.test,10.7.7.179
host-record=api.teamX.test,10.7.7.179
# Log every query to the terminal (great live evidence)
log-queries
log-facility=-
