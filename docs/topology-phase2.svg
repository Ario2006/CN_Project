<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1100" height="640" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">Private Network Service Platform - Phase 2 topology</text>
  <text x="550" y="58" text-anchor="middle" font-size="13" fill="#475569">One private Wi-Fi subnet (all 4 Macs) - live IPs: demo/01-topology.sh · domain teamTeamCN.test · TTL 30 s</text>
  <rect x="20" y="75" width="1060" height="545" rx="14" fill="none" stroke="#cbd5e1" stroke-dasharray="6 5"/>

  <!-- Client -->
  <rect x="40" y="260" width="170" height="110" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="125" y="290" text-anchor="middle" font-size="15" font-weight="bold" fill="#4c1d95">Client</text>
  <text x="125" y="310" text-anchor="middle" font-size="12" fill="#334155">Mac 1 (Aryan) / Mac 4 (Ankita)</text>
  <text x="125" y="330" text-anchor="middle" font-size="12" fill="#334155">curl / Safari</text>
  <text x="125" y="350" text-anchor="middle" font-size="11" fill="#475569">resolvers: Mac 1, Mac 3</text>

  <!-- Primary DNS -->
  <rect x="300" y="95" width="230" height="95" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="415" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Mac 1 · PRIMARY DNS</text>
  <text x="415" y="142" text-anchor="middle" font-size="12" fill="#334155">dnsmasq · UDP 53</text>
  <text x="415" y="160" text-anchor="middle" font-size="11" fill="#475569">app/api -&gt; edge · TTL 30 s</text>
  <text x="415" y="178" text-anchor="middle" font-size="11" fill="#475569">≈ Route 53 private zone</text>

  <!-- Backup DNS -->
  <rect x="300" y="440" width="230" height="95" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="415" y="467" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Mac 3 · BACKUP DNS (Ext A)</text>
  <text x="415" y="487" text-anchor="middle" font-size="12" fill="#334155">dnsmasq · UDP 53</text>
  <text x="415" y="505" text-anchor="middle" font-size="11" fill="#475569">identical records, used when</text>
  <text x="415" y="521" text-anchor="middle" font-size="11" fill="#475569">primary does not answer</text>

  <!-- Primary edge -->
  <rect x="600" y="230" width="210" height="120" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="705" y="257" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c2d12">Mac 2 · PRIMARY EDGE</text>
  <text x="705" y="277" text-anchor="middle" font-size="12" fill="#334155">nginx · TCP 443</text>
  <text x="705" y="295" text-anchor="middle" font-size="11" fill="#475569">TLS termination (SAN app/api)</text>
  <text x="705" y="312" text-anchor="middle" font-size="11" fill="#475569">round-robin + passive health check</text>
  <text x="705" y="330" text-anchor="middle" font-size="11" fill="#475569">X-Edge: primary · ≈ AWS ALB</text>

  <!-- Standby edge -->
  <rect x="600" y="430" width="210" height="105" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="705" y="457" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c2d12">Mac 3 · STANDBY EDGE</text>
  <text x="705" y="477" text-anchor="middle" font-size="12" fill="#334155">nginx · TCP 443 · same config + cert</text>
  <text x="705" y="495" text-anchor="middle" font-size="11" fill="#475569">X-Edge: standby · (Ext E)</text>
  <text x="705" y="513" text-anchor="middle" font-size="11" fill="#475569">reached via DNS cutover of app</text>

  <!-- Backends -->
  <rect x="890" y="150" width="175" height="115" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="977" y="177" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">Mac 3 · Backend A</text>
  <text x="977" y="197" text-anchor="middle" font-size="12" fill="#334155">Python REST · TCP 3001</text>
  <text x="977" y="215" text-anchor="middle" font-size="11" fill="#475569">X-Backend: A</text>
  <text x="977" y="238" text-anchor="middle" font-size="11" fill="#b91c1c">pf: only Mac 2 may connect</text>
  <text x="977" y="254" text-anchor="middle" font-size="11" fill="#b91c1c">(Ext C)</text>

  <rect x="890" y="320" width="175" height="115" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="977" y="347" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">Mac 4 · Backend B</text>
  <text x="977" y="367" text-anchor="middle" font-size="12" fill="#334155">Python REST · TCP 3002</text>
  <text x="977" y="385" text-anchor="middle" font-size="11" fill="#475569">X-Backend: B</text>
  <text x="977" y="408" text-anchor="middle" font-size="11" fill="#b91c1c">pf: only Mac 2 may connect</text>
  <text x="977" y="424" text-anchor="middle" font-size="11" fill="#b91c1c">(Ext C)</text>

  <!-- arrows -->
  <line x1="210" y1="280" x2="300" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="118" y="225" font-size="12" fill="#1e3a8a">1. DNS query UDP 53</text>
  <line x1="210" y1="355" x2="300" y2="470" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g)"/>
  <text x="110" y="420" font-size="12" fill="#1e3a8a">1'. if primary down</text>
  <line x1="210" y1="305" x2="600" y2="290" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="330" y="282" font-size="12" fill="#7c2d12">2. TCP 443 + TLS + HTTP (by name)</text>
  <line x1="210" y1="345" x2="600" y2="470" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g)"/>
  <text x="395" y="392" font-size="12" fill="#7c2d12">2'. after DNS cutover (TTL expiry)</text>
  <line x1="810" y1="270" x2="890" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="810" y1="310" x2="890" y2="370" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="812" y="300" font-size="11" fill="#14532d">3. HTTP</text>
  <line x1="810" y1="460" x2="890" y2="250" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#g)"/>
  <line x1="810" y1="490" x2="890" y2="420" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#g)"/>

  <text x="40" y="585" font-size="12" fill="#334155">Solid = normal path · Dashed = Phase 2 resilience path · Red = pf service isolation · Remaining single point of failure: the active edge + the Wi-Fi LAN.</text>
  <text x="40" y="605" font-size="12" fill="#334155">Fix ideas: 2 edges + VRRP floating IP, or health-checked DNS (Route 53 failover), or a managed multi-AZ load balancer.</text>
</svg>
